services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: chat, POSTGRES_PASSWORD: chat, POSTGRES_DB: chat}
  redis:
    image: redis:7
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://chat:chat@db:5432/chat
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
    depends_on: [db, redis]
    ports: ["8000:8000"]